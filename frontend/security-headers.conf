# Baseline security headers. Included into every `location` block so the
# nginx rule "if a child location uses add_header, parent add_headers are
# ignored" doesn't silently drop headers on assets/index/API responses.

add_header X-Frame-Options            "SAMEORIGIN"   always;
add_header X-Content-Type-Options     "nosniff"      always;
add_header Referrer-Policy            "no-referrer"  always;
add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"  always;
