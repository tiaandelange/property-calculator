# SPA + reverse-proxy site config. Served by the nginx-unprivileged base image,
# which runs the master as UID 101 and listens on 8080 by default.
#
# Topology in production:
#
#   client ─► nginx (this container, :8080) ─┬─► static SPA bundle
#                                            └─► /api/* proxied to backend:4000
#
# Same-origin /api means the browser never triggers a CORS preflight, which is
# both faster and removes a class of misconfiguration risk.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---------------------------------------------------------------------------
  # Hardening defaults
  # ---------------------------------------------------------------------------
  # Don't leak the nginx version in error pages / Server header.
  server_tokens off;

  # Cap request body size — the SPA never POSTs to nginx directly except via
  # the /api proxy, and the API has its own multer/JSON limits, but adding an
  # upstream cap protects against accidental misuse of /api endpoints.
  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 30s;
  send_timeout 30s;

  # gzip for text-like content. nginx already excludes well-compressed types.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml
    font/woff2;

  # Resolve the `backend` hostname at request time via Docker's embedded DNS
  # resolver (127.0.0.11 inside any user-defined network). Without this, nginx
  # would resolve the upstream hostname at config-load time and refuse to even
  # start if the backend container happened to be unavailable during a boot
  # cycle. Using a variable in `proxy_pass` forces the runtime lookup path.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ---------------------------------------------------------------------------
  # Health endpoint
  # ---------------------------------------------------------------------------
  # Returned directly by nginx with no upstream call — keeps the container's
  # HEALTHCHECK independent of whether the backend is up.
  location = /healthz {
    include /etc/nginx/conf.d/security-headers.conf;
    access_log off;
    add_header Content-Type "text/plain";
    return 200 "ok\n";
  }

  # ---------------------------------------------------------------------------
  # API reverse proxy
  # ---------------------------------------------------------------------------
  # Same-origin proxy onto the backend service. The trailing-slash style keeps
  # the /api prefix in the upstream URL so Express routes (`/api/auth`, etc.)
  # match unchanged.
  location /api/ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-store" always;

    set $backend_upstream "http://backend:4000";
    proxy_pass         $backend_upstream;
    proxy_http_version 1.1;

    # Pass-through headers the backend uses to log and to derive client IPs.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # PDF downloads can be a few MB so a 60 s read timeout is the floor.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Streamed responses (large PDFs) — disable buffering so the response
    # starts hitting the wire before the upstream is fully done.
    proxy_buffering off;
    proxy_request_buffering off;
  }

  # ---------------------------------------------------------------------------
  # Static SPA
  # ---------------------------------------------------------------------------
  # Vite emits hashed filenames under /assets/ — safe to cache aggressively.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # index.html must never be cached — it bootstraps the bundle hashes.
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Reduce noise from probe traffic.
  location = /favicon.ico { log_not_found off; access_log off; }
  location = /robots.txt  { log_not_found off; access_log off; }

  # SPA history-mode fallback: any unknown path serves index.html so the React
  # router can take over client-side. The internal rewrite triggers re-matching
  # against `location = /index.html`, which carries the security headers.
  location / {
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
